# Codex-konfiguration for AI OS (SOSU Randers)
#
# Dette er Codex' modstykke til .claude/settings.json. Codex laeser KUN TOML fra
# .codex/ (smaa bogstaver) - Claude Codes JSON-format har ingen virkning her, og
# omvendt. De to filer udtrykker den samme hensigt i hvert sit format.
#
# Naeglereference: https://learn.chatgpt.com/docs/config-file/config-reference
#
# VIGTIGT: Codex loader kun projekt-lokale .codex/-lag hvis projektet er markeret
# som betroet. Det sker i din personlige ~/.codex/config.toml, ikke her - se
# afsnittet "Codex-opsaetning paa en ny maskine" i AGENTS.md.

# --- AGENTS.md-indlaesning ------------------------------------------------
# AGENTS.md er det byte-identiske spejl af CLAUDE.md og vokser hver gang en ny
# laering skrives ind. Standardloftet er 65536 bytes, og filen ligger allerede
# omkring 43 KB - naar den passerer graensen, afkortes den UDEN varsel, og Codex
# mister de nederste afsnit (PowerShell-, TMDL- og PBIR-faelderne staar der).
project_doc_max_bytes = 262144

# Falder tilbage til Claude Codes fil hvis AGENTS.md mangler. Samme indhold, saa
# et brudt spejl giver reducerede regler frem for ingen regler.
project_doc_fallback_filenames = ["CLAUDE.md"]

# --- Sandkasse og godkendelser -------------------------------------------
# Svarer til hensigten i .claude/settings.json: laes og skriv frit i arbejdsmappen,
# men spoerg foer noget raekker udenfor. Sikkerhedsreglerne i AGENTS.md gaelder
# uanset hvad der staar her - de er strengere end sandkassen.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
# Ingen netvaerksadgang uden godkendelse. Persondata maa ikke forlade maskinen.
network_access = false

# AI OS/AI-SOSU er en junction til den fysiske soestermappe. Giv den kanoniske
# projektrod eksplicit skriveadgang, saa almindelige projektedits ikke udloeser
# sandbox-godkendelse blot fordi Windows oploeser junctionen.
writable_roots = [
  'C:\Users\jst\OneDrive - Social og Sundhedsskolen Randers\AI-SOSU',
]
